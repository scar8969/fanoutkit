name: Bug report
description: Something behaves differently from what the README says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more of this you fill in, the faster it can be reproduced.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The actual behaviour, including the response body or the traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python wsgi.py
        2. curl -s http://127.0.0.1:8000/...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git describe --tags` or the image tag.
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.11", "3.12", "3.13", "other"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: The service logs structured JSON; paste the lines around the failure.
      render: json
