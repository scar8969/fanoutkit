[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanoutkit"
version = "0.1.0"
description = "Self-hosted message fan-out: one HTTP call from your app, delivered to every configured channel with retries and per-channel status."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Rout" }]
keywords = ["flask", "service", "message_pusher"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    'Flask>=3.0',
    'Flask-SQLAlchemy>=3.1',
    'SQLAlchemy>=2.0',
    'PyYAML>=6.0',
    'requests>=2.31',
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-requests",
  "coverage>=7.5",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://example.invalid/message_pusher"
Documentation = "https://example.invalid/message_pusher/docs"
Issues = "https://example.invalid/message_pusher/issues"

[project.scripts]
fanoutkit = "message_pusher.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
message_pusher = ["py.typed", "app.py", "http.py", "observability.py", "paths.py", "templates/*", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# The floor sits five points under the coverage measured on this
# checkout at v0.1.0, so a real regression fails the gate and a few new
# lines do not.
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]


# lint ignores — every rule below is a deliberate exception:
#   B017: the test asserts a broad failure on purpose
#   E501: line length is enforced by ruff format, not by the linter
#   N818: exception names are public API and predate the Error-suffix rule
#   RUF012: the attribute is declarative model configuration
#   RUF059: the unpacked names document the tuple shape
#   S101: tests assert
#   S104: the service binds 0.0.0.0 by design
#   S105: test fixtures use obvious placeholder credentials
#   S310: the URL comes from validated operator configuration
#   UP031: percent-formatting keeps logging arguments lazy
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
  "B017",
  "E501",
  "N818",
  "RUF012",
  "RUF059",
  "S101",
  "S104",
  "S105",
  "S310",
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
# __all__ order is the documented contract these shims are tested against.
"src/message_pusher/pusher/channels/*.py" = ["RUF022"]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["message_pusher"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "sqlalchemy.*", "flask_sqlalchemy.*"]
ignore_missing_imports = true

# flask_sqlalchemy stores the declarative base on the extension instance, so the
# base class of App, Message and Receipt is a plain Any; subclassing it is
# correct and intentional, and this is the only module where it happens.
[[tool.mypy.overrides]]
module = ["message_pusher.models", "models"]
disallow_subclassing_any = false

[tool.bandit]
# Reviewed findings, each inherent to the architecture:
#   B104: the service binds 0.0.0.0 inside a container; the port is the contract
#   B310: urlopen targets an operator-configured endpoint, never user input
skips = ["B104", "B310"]
